[project]
name = "bookmark"
version = "0.1.0"
description = "Bookmark sample"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.139.*",
    "uvicorn[standard]==0.49.*",
    "pwdlib[bcrypt]==0.3.*",
    "PyMySQL==1.1.*",
    "pyjwt==2.13.*",
    "python-dotenv==1.1.*",
    "python-multipart==0.0.*",
    "sqlalchemy==2.0.*",
    "redis==8.0.*",
    "dogpile-cache==1.5.*",
    "zstandard==0.25.*",
]

[dependency-groups]
dev = [
    "bandit==1.9.*",
    "httpx2==2.4.*",
    "pyrefly==1.1.*",
    "pytest==9.1.*",
    "ruff==0.15.*",
    "taskipy==1.14.*",
    "types-passlib==1.7.*",
    "types-PyMySQL==1.1.*",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"
exclude = [
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = true

[tool.taskipy.tasks]
test = "docker compose exec api python -m pytest"
format = "ruff format ./"
check = "pyrefly check ; bandit --quiet --recursive src"
build_app = "docker compose build api"
login_app = "docker compose exec api bash"
openapi = "python -m src.generate_openapi > openapi.json"
update_packages = "uv lock --upgrade && uv sync"

[tool.pyrefly]
project-excludes = ["**/tests/"]
python-version = "3.13"
