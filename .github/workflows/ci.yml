name: Check and Tests

env:
  MYSQL_IMAGE: mysql:8.4
  REDIS_IMAGE: redis:8.6-alpine

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "LICENSE"

jobs:
  check:
    name: Run check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: ".python-version"
      - name: Install python packages
        run: uv sync --all-extras
      - name: Check format
        run: uv run ruff format --check ./
      - name: Lint codes
        run: uv run ruff check ./
      - name: Check types
        run: uv run pyrefly check
      - name: Check security issues in Python code
        run: uv run bandit --quiet --recursive src
      - name: Check update openapi.json
        run: diff ./openapi.json <(uv run python -m src.generate_openapi)
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: ".python-version"
      - name: Install python packages
        run: uv sync --all-extras
      - name: Prepare DB image cache metadata
        id: docker-image-cache-meta
        env:
          COMPOSE_HASH: ${{ hashFiles('compose.yaml') }}
        run: |
          mysql_image_key=$(printf '%s' "${MYSQL_IMAGE}" | sed 's/[^[:alnum:]_.-]/-/g')
          redis_image_key=$(printf '%s' "${REDIS_IMAGE}" | sed 's/[^[:alnum:]_.-]/-/g')
          {
            echo "cache-key=${RUNNER_OS}-db-images-${mysql_image_key}-${redis_image_key}-${COMPOSE_HASH}"
            echo "mysql-tar=/tmp/.docker-image-cache/${mysql_image_key}.tar"
            echo "redis-tar=/tmp/.docker-image-cache/${redis_image_key}.tar"
          } >> "${GITHUB_OUTPUT}"
      - name: Restore DB image cache
        id: docker-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.docker-image-cache
          key: ${{ steps.docker-image-cache-meta.outputs.cache-key }}
      - name: Load cached DB images
        run: |
          if [ -f "${{ steps.docker-image-cache-meta.outputs.mysql-tar }}" ]; then
            docker load --input "${{ steps.docker-image-cache-meta.outputs.mysql-tar }}"
          fi
          if [ -f "${{ steps.docker-image-cache-meta.outputs.redis-tar }}" ]; then
            docker load --input "${{ steps.docker-image-cache-meta.outputs.redis-tar }}"
          fi
      - name: Setup DB container
        run: docker compose up -d --quiet-pull --wait db redis
      - name: Save DB image cache
        if: steps.docker-image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/.docker-image-cache
          docker save --output "${{ steps.docker-image-cache-meta.outputs.mysql-tar }}" "${MYSQL_IMAGE}"
          docker save --output "${{ steps.docker-image-cache-meta.outputs.redis-tar }}" "${REDIS_IMAGE}"
      - name: Persist DB image cache
        if: steps.docker-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.docker-image-cache
          key: ${{ steps.docker-image-cache-meta.outputs.cache-key }}
      - name: Run tests
        run: uv run pytest
        env:
          TEST_DB_HOST: localhost
          BLACKLIST_REDIS_URL: redis://localhost:6379/0
